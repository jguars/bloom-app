name: bloom
description: "Bloom: move together with Clover"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  rive: ^0.14.11
  image_picker: ^1.2.3
  home_widget: ^0.10.0
  alarm: ^5.15.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenes/
    - assets/sfx/
    - assets/rive/
    - assets/widget/
    - assets/alarm/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

dependency_overrides:
  # 13.0.2 needs compileSdk 37, which AGP 9.1 does not support yet.
  permission_handler_android: 13.0.1
